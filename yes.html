<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE YOU TOO SOO MUCHH MERI SUMAN☺️</title>
  <link rel="stylesheet" href="@import url('https://googleapis.com');">


  <style>
    /* Reset and Fullscreen Setup */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::selection {
      background-color: rgba(105, 183, 187, 0.704);
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #f7aef8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    /* Main Container holding everything vertically */
    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    /* 1. Top Element: The Aesthetic Couple Face */
    .couple-avatar {
      position: relative;
      width: 220px;
      height: 220px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(255, 75, 110, 0.15);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    /* Smiley Face Features */
    .eyes-container {
      position: absolute;
      top: 38%;
      width: 66%;
      left: 17%;
      display: flex;
      justify-content: space-between;
    }

    .eye.left {
      width: 28px;
      height: 12px;
      border-bottom: 5px solid #4a304d;
      border-radius: 0 0 20px 20px;
      transform: translateY(5px);
    }

    .eye.right {
      width: 28px;
      height: 28px;
      border-top: 5px solid #4a304d;
      border-radius: 50% 50% 0 0;
    }

    .blush-container {
      position: absolute;
      top: 52%;
      width: 80%;
      left: 10%;
      display: flex;
      justify-content: space-between;
    }

    .blush {
      width: 38px;
      height: 18px;
      background: rgba(255, 105, 140, 0.5);
      filter: blur(4px);
      border-radius: 50%;
      animation: pulseBlush 3s ease-in-out infinite alternate;
    }

    @keyframes pulseBlush {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.1);
        opacity: 0.9;
      }
    }

    .mouth {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 16px;
      border-bottom: 5px solid #4a304d;
      border-radius: 0 0 30px 30px;
    }

    /* 2. Bottom Element: Textarea & Button Box */
    .ui-container {
      width: 360px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    /* Aesthetic Custom Textarea */
    .couple-textarea {
      width: 100%;
      height: 110px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px dashed #ffb3c6;
      border-radius: 16px;
      padding: 15px;
      font-size: 1rem;
      color: #5c3d46;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: all 0.3s ease;
      box-shadow: inset 0 4px 10px rgba(255, 179, 198, 0.15);
    }

    .couple-textarea:focus {
      border-color: #ff4d6d;
      background: #ffffff;
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
    }

    .couple-textarea::placeholder {
      color: #a3888f;
      font-style: italic;
    }

    /* Sweet Heart-Themed Submit Button */
    .send-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: linear-gradient(45deg, #ff4d6d, #ff758f);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .send-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(255, 77, 109, 0.45);
      background: linear-gradient(45deg, #ff758f, #ff4d6d);
    }

    .send-btn:active {
      transform: translateY(1px);
    }

    /* Floating Hearts Inside Smiley */
    .hearts-sparkles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      background: #ff4d6d;
      width: 14px;
      height: 14px;
      transform: rotate(-45deg);
      border-radius: 50% 50% 0 0;
      opacity: 0;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      background: #ff4d6d;
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .heart::before {
      top: -7px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 7px;
    }

    .h1 {
      top: -10px;
      left: 20px;
      animation: floatUp 4s ease-in-out infinite;
    }

    .h2 {
      top: 30px;
      right: -15px;
      animation: floatUp 5s ease-in-out 1s infinite;
    }

    .h3 {
      bottom: 20px;
      left: -20px;
      animation: floatUp 4.5s ease-in-out 0.5s infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(20px) rotate(-45deg) scale(0.5);
        opacity: 0;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-50px) rotate(-20deg) scale(1.1);
        opacity: 0;
      }
    }

    .love-word {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      color: #d63384;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .emoji {
      font-family: "poppins", Arial, Helvetica, sans-serif;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      color: #d63384;
    }
  </style>
</head>

<body>

  <!-- Layout Wrapper -->
  <div class="main-wrapper">

    <!-- 1. Smiley Face on Top -->
    <div class="couple-avatar">
      <div class="hearts-sparkles">
        <div class="heart h1"></div>
        <div class="heart h2"></div>
        <div class="heart h3"></div>
      </div>
      <div class="eyes-container">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
      <div class="blush-container">
        <div class="blush"></div>
        <div class="blush"></div>
      </div>
      <div class="mouth"></div>
    </div>

    <!-- 2. Textarea and Button Right Below It -->
    <div class="ui-container">
      <textarea class="couple-textarea"
        placeholder=" Type your heart words...❤️‍🩹And also send ss to guhuwaaaa."></textarea>
      <a href="send.html" style="text-decoration: none;">
        <button class="send-btn">
          *Send to your guhuwaaaa 💖*
        </button>
    </div>
    </a>
    <div class="love-word">
      <h3>
        *I LOVE YOU TO MERI SUMAN☺️*
      </h3>
    </div>
    <div class="emoji">
      |Umaaaaaaaaaahh😘|
    </div>

  </div>

</body>

</html>
